<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Banco del motor · 2</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; color: #1d2433; background: #fbfaf7; }
  button { font: inherit; padding: .55rem 1.1rem; border: 0; border-radius: .4rem; background: #2f5bd3; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  pre { background: #fff; border: 1px solid #ddd; padding: .8rem; white-space: pre-wrap; font: 13px/1.45 ui-monospace, monospace; }
  .fase { font-weight: 600; }
  label { margin-right: 1rem; }
</style>
</head>
<body>
<h1>Banco del motor · 2</h1>
<p>Compara el motor de Elffuss con la librería de LiquidAI y con onnxruntime-web en este equipo, y mira en qué se va el tiempo
en la gráfica y en la CPU. La primera vez baja unos 4 GB. Deja la pestaña delante y no uses el equipo mientras tanto.</p>
<p>
  <label><input type="checkbox" id="c-duelo" checked> Duelo contra LiquidAI</label>
  <label><input type="checkbox" id="c-perfil" checked> Perfil de la gráfica</label>
  <label><input type="checkbox" id="c-cpu" checked> CPU con hilos</label>
  <label><input type="checkbox" id="c-voz" checked> Voz contra ONNX</label>
</p>
<p><button id="go">Empezar</button> <button id="copiar" hidden>Copiar resultados</button></p>
<p class="fase" id="fase"></p>
<pre id="out"></pre>
<script type="module">
const ENGINE = new URL('./js/engine/', location.href).href;   // la copia del motor del chat (mismo origen: los Workers lo exigen)
const LIQUID = 'https://liquidai-lfm3-omni-2b-webgpu.static.hf.space/Lfm3OmniForConditionalGeneration.js';
const PARAM = new URLSearchParams(location.search);
const OMNI = PARAM.get('omni') || 'https://huggingface.co/LiquidAI/LFM3-Omni-2B-GGUF/resolve/main/';
const TTS = PARAM.get('tts') || 'https://huggingface.co/OpenMOSS-Team/MOSS-TTS-Nano-100M-ONNX/resolve/f52645cb/';
const ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/';
const $ = (id) => document.getElementById(id);
const out = (s) => { $('out').textContent += s + '\n'; };
const fase = (s) => { $('fase').textContent = s; };
const med = (a) => { const v = [...a].sort((x, y) => x - y); return v[v.length >> 1]; };
const Q = 'Lee este texto y resúmelo en cinco frases claras para alguien que no sabe nada del tema.\n\n' +
  'Los faros han guiado a los navegantes durante más de dos mil años. El faro de Alejandría, construido en el siglo III antes de Cristo en la isla de Faros, ' +
  'medía más de cien metros y su fuego se veía a decenas de kilómetros. Durante siglos los faros funcionaron con hogueras de madera y después con aceite de ballena y queroseno. ' +
  'En el siglo XIX Augustin Fresnel inventó una lente escalonada que concentraba la luz en un haz potente sin necesidad de un espejo enorme, y su diseño se extendió por todo el mundo. ' +
  'Cada faro tiene una secuencia propia de destellos, llamada característica, que permite a los marinos identificarlo de noche. Los fareros vivían junto a la torre, mantenían la lámpara encendida, ' +
  'limpiaban las lentes y anotaban el tiempo. Con la electricidad y la automatización la mayoría de los fareros desaparecieron en la segunda mitad del siglo XX. ' +
  'Hoy el GPS ha reducido la dependencia de los faros, pero siguen siendo una ayuda importante cuando fallan los sistemas electrónicos, y muchos se han convertido en museos o alojamientos.';

// Los hilos de la CPU exigen una página aislada (COOP/COEP). La pone el mismo service worker que el chat.
async function aislar() {
  if (self.crossOriginIsolated) return true;
  try {
    await navigator.serviceWorker.register(new URL('../coi-sw.js', location.href), { scope: new URL('../', location.href).pathname });
    await navigator.serviceWorker.ready;
    sessionStorage.setItem('banco-v2-seguir', '1');
    location.reload();
  } catch (e) { out('no se pudo aislar la página (la CPU irá con un hilo): ' + e.message); }
  return false;
}

async function duelo() {
  const e = await import(ENGINE + 'provider.js');
  const size = +(await fetch(OMNI + 'LFM3-Omni-2B-Q4_0.gguf', { headers: { Range: 'bytes=0-0' } })).headers.get('content-range').split('/')[1];
  e.configure('lfm3-1.7b-q4'); e.__setModelForTest(OMNI + 'LFM3-Omni-2B-Q4_0.gguf', size);
  await e.load((s) => fase('duelo · Elffuss: ' + String(s).slice(0, 70)));
  e.setSampling({ temperature: 0, seed: 1, maxTokens: 128, razonar: false });
  fase('duelo · cargando la librería de LiquidAI y su modelo');
  const { Lfm3OmniForConditionalGeneration: M } = await import(LIQUID);
  const modelo = await M.from_pretrained(OMNI + 'LFM3-Omni-2B-Q4_K_M.gguf', { mmproj: OMNI + 'mmproj-LFM3-Omni-2B-Q8_0.gguf' });
  const nuestro = async () => { e.__olvidaPrefijo(); let t = ''; await e.chat([{ role: 'user', content: Q }], '', (p) => { t += p; }); const m = e.ultimaMedida(); return { lee: m.promptTokens / (m.ttftMs / 1000), escribe: m.genTokS, prompt: m.promptTokens, texto: t }; };
  const suyo = async () => { const s = modelo.create_session(); const g = s.generate([{ role: 'user', content: Q }], { max_new_tokens: 128, do_sample: false }); let t = ''; for await (const ev of g) if (ev?.type === 'token' || ev?.type === 'text' || ev?.delta) t += ev.text ?? ev.delta ?? ''; const r = await g.result; return { lee: r.usage.prompt_tokens / (r.timings.ttft_ms / 1000), escribe: r.timings.tokens_per_second, prompt: r.usage.prompt_tokens, texto: r.content || t }; };
  fase('duelo · calentando'); await nuestro(); await suyo();
  const A = [], B = [];
  for (let k = 0; k < 3; k++) { fase(`duelo · ronda ${k + 1} de 3`); if (k % 2) { B.push(await suyo()); A.push(await nuestro()); } else { A.push(await nuestro()); B.push(await suyo()); } }
  const f = (n, a) => `${n}: prompt ${a[0].prompt} tok · lee ${med(a.map((x) => x.lee)).toFixed(0)} tok/s · escribe ${med(a.map((x) => x.escribe)).toFixed(1)} tok/s`;
  out(f('Elffuss (Q4_0)', A)); out(f('LiquidAI (Q4_K_M)', B));
  out(`RAZÓN Elffuss/LiquidAI: lectura ×${(med(A.map((x) => x.lee)) / med(B.map((x) => x.lee))).toFixed(2)} · escritura ×${(med(A.map((x) => x.escribe)) / med(B.map((x) => x.escribe))).toFixed(2)}`);
  out('texto Elffuss: ' + A[0].texto.slice(0, 120).replace(/\n/g, ' '));
  out('texto LiquidAI: ' + String(B[0].texto).slice(0, 120).replace(/\n/g, ' '));
  await e.unload();
  try { await modelo.dispose?.(); } catch { /* — */ }
}

async function perfil() {
  const { requestDevice } = await import(ENGINE + 'device.js');
  const { loadModel, createSession } = await import(ENGINE + 'model.js');
  const { aplicaRapido, MODELS } = await import(ENGINE + 'provider.js');
  const url = PARAM.get('lfm3') || MODELS?.['lfm3-1.7b-q4']?.url || (await import(ENGINE + 'registro.js')).MODELS['lfm3-1.7b-q4'].url;
  const size = +(await fetch(url, { headers: { Range: 'bytes=0-0' } })).headers.get('content-range').split('/')[1];
  aplicaRapido('lfm3');
  const gpu = await requestDevice({ label: 'perfil', timestamp: true });
  if (!gpu.subgroupSize) globalThis.__ELFFUSS_GEMM2_TESELA = true;   // lo mismo que hace el motor sin subgrupos fijos
  const dev = gpu.device;
  if (!dev.features.has('timestamp-query')) { out('esta gráfica no da marcas de tiempo: no hay perfil'); return; }
  const ranged = { size, async slice(o, l) { const r = await fetch(url, { headers: { Range: `bytes=${o}-${o + l - 1}` } }); return await r.arrayBuffer(); } };
  fase('perfil · cargando LFM3 Q4');
  const model = await loadModel(ranged, dev, { debug: false, subgroupSize: gpu.subgroupSize });
  const ctx = model.ops.ctx;
  const ses = createSession(model, { contextLen: 2048 });
  let tok = 500;
  await ses.forward(Array.from({ length: 64 }, (_, i) => 1000 + i)); await dev.queue.onSubmittedWorkDone(); ses.recycle();
  for (let i = 0; i < 6; i++) { await ses.forward([tok++]); await dev.queue.onSubmittedWorkDone(); ses.recycle(); }
  const ms = []; for (let i = 0; i < 12; i++) { const t0 = performance.now(); await ses.forward([tok++]); await dev.queue.onSubmittedWorkDone(); ms.push(performance.now() - t0); ses.recycle(); }
  const acum = new Map(); let total = 0;
  for (let i = 0; i < 4; i++) { ctx.perfilar(400); await ses.forward([tok++]); const r = await ctx.finProfile(); ses.recycle(); total += r.total; for (const x of r.porLabel) { const a = acum.get(x.lab) || { ns: 0, n: 0 }; a.ns += x.ns; a.n += x.veces; acum.set(x.lab, a); } }
  out(`subgrupo del motor: ${gpu.subgroupSize || 'variable (camino sin subgrupos)'} · un token: ${med(ms).toFixed(2)} ms (${(1000 / med(ms)).toFixed(1)} tok/s) · suma de kernels perfilados ${(total / 4 / 1e6).toFixed(2)} ms`);
  for (const [k, a] of [...acum].sort((x, y) => y[1].ns - x[1].ns).slice(0, 12)) out(`  ${(a.ns / 4 / 1e3).toFixed(0).padStart(6)} µs  ${String(a.n / 4).padStart(3)}×  ${k}`);
  await ses.destroy?.(); dev.destroy();
}

async function cpu() {
  const e = await import(ENGINE + 'provider.js');
  const largo = Q;
  for (const h of [1, 4, 8]) {
    if (h > 1 && !self.crossOriginIsolated) { out(`  ${h} hilos: la página no está aislada`); continue; }
    globalThis.__ELFFUSS_CPU = true; globalThis.__ELFFUSS_HILOS = h;
    e.configure('lfm3-1.7b-q4');
    if (PARAM.get('lfm3')) e.__setModelForTest(PARAM.get('lfm3'), 1049615680);
    await e.load((s) => fase(`CPU ${h} hilos: ` + String(s).slice(0, 70)));
    e.setSampling({ temperature: 0, maxTokens: 48, razonar: false });
    const corre = async () => { e.__olvidaPrefijo(); let t = ''; await e.chat([{ role: 'user', content: largo }], '', (p) => { t += p; }); const m = e.ultimaMedida(); return { lee: m.prefillTokS, esc: m.genTokS }; };
    fase(`CPU ${h} hilos: midiendo`);
    await corre(); const a = [await corre(), await corre()];
    out(`  ${h} hilo(s): lee ${Math.max(...a.map((x) => x.lee)).toFixed(1)} tok/s · escribe ${Math.max(...a.map((x) => x.esc)).toFixed(1)} tok/s`);
    await e.unload();
  }
  globalThis.__ELFFUSS_CPU = undefined; globalThis.__ELFFUSS_HILOS = undefined;
}

async function voz() {
  const { cargaVoz, cargaVozCpu } = await import(ENGINE + 'provider.js');
  const v = await cargaVoz();
  const manifest = await (await fetch(TTS + 'browser_poc_manifest.json')).json();
  const meta = await (await fetch(TTS + 'tts_browser_onnx_meta.json')).json();
  const baja = async (f) => { fase(`voz: bajando ${f}`); return new Uint8Array(await (await fetch(TTS + f)).arrayBuffer()); };
  const G = await baja('moss_tts_global_shared.data'), L = await baja('moss_tts_local_shared.data');
  const rango = (b) => ({ size: b.length, slice: async (o, l) => b.slice(o, o + l).buffer });
  const fuente = v.fuenteOnnx({ 'moss_tts_global_shared.data': rango(G), 'moss_tts_local_shared.data': rango(L) }, v.MOSS_ONNX_MAPA);
  const c = manifest.tts_config, t = manifest.prompt_templates, W = c.n_vq + 1;
  const vozRef = manifest.builtin_voices.find((x) => x.voice === 'Ava'), ids = manifest.text_samples[0].text_token_ids;
  const before = [...t.user_prompt_prefix_token_ids, c.audio_start_token_id];
  const after = [c.audio_end_token_id, ...t.user_prompt_after_reference_token_ids, ...ids, ...t.assistant_prompt_prefix_token_ids, c.audio_start_token_id];
  const filas = new Int32Array((before.length + vozRef.prompt_audio_codes.length + after.length) * W).fill(c.audio_pad_token_id);
  let r = 0; for (const id of before) filas[(r++) * W] = id;
  for (const fr of vozRef.prompt_audio_codes) { filas[r * W] = c.audio_user_slot_token_id; fr.forEach((x, q) => { filas[r * W + 1 + q] = x; }); r++; }
  for (const id of after) filas[(r++) * W] = id;
  const N = 24;
  const rng = (s) => () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const res = {};
  // Elffuss en la CPU
  for (const h of [1, 8]) {
    if (h > 1 && !self.crossOriginIsolated) continue;
    fase(`voz: Elffuss CPU ${h} hilos`);
    const m = await (await cargaVozCpu()).cargaMossCpu(fuente, { hilos: h });
    const ts = []; let tramas;
    for (let i = 0; i < 2; i++) { const t0 = performance.now(); tramas = await m.genera(filas, rng(7), { max: N }); ts.push(performance.now() - t0); }
    res['Elffuss ' + h] = { ms: Math.min(...ts), tramas };
  }
  // onnxruntime-web, el camino oficial del navegador
  const ort = await import(ORT + 'ort.wasm.bundle.min.mjs');
  ort.env.wasm.wasmPaths = ORT;
  const grafo = async (f) => new Uint8Array(await (await fetch(TTS + f)).arrayBuffer());
  for (const h of [1, 4]) {
    if (h > 1 && !self.crossOriginIsolated) continue;
    fase(`voz: onnxruntime-web ${h} hilos`);
    ort.env.wasm.numThreads = h;
    const ses = async (g, d, n) => ort.InferenceSession.create(await grafo(g), { executionProviders: ['wasm'], graphOptimizationLevel: 'all', externalData: [{ path: n, data: d }] });
    const pre = await ses('moss_tts_prefill.onnx', G, 'moss_tts_global_shared.data');
    const dec = await ses('moss_tts_decode_step.onnx', G, 'moss_tts_global_shared.data');
    const fr = await ses('moss_tts_local_fixed_sampled_frame.onnx', L, 'moss_tts_local_shared.data');
    const names = meta.onnx, rows = filas.length / W;
    const last = (x) => { const [, s, hh] = x.dims; return new ort.Tensor('float32', x.data.slice((s - 1) * hh, s * hh), [1, hh]); };
    const ts = []; let tramas;
    for (let i = 0; i < 2; i++) {
      const u = rng(7); const t0 = performance.now();
      let o = await pre.run({ input_ids: new ort.Tensor('int32', filas, [1, rows, W]), attention_mask: new ort.Tensor('int32', new Int32Array(rows).fill(1), [1, rows]) });
      let hid = last(o.global_hidden), past = Object.fromEntries(names.prefill_output_names.slice(1).map((n) => [n.replace('present_', 'past_'), o[n]]));
      let valid = rows; const seen = Array.from({ length: 16 }, () => new Uint8Array(1024)); tramas = [];
      for (let s = 0; s < N; s++) {
        const mask = new Int32Array(16 * 1024); seen.forEach((sq, q) => { for (let k = 0; k < 1024; k++) if (sq[k]) mask[q * 1024 + k] = 1; });
        const cl = (x) => Math.min(0.99999994, Math.max(0, x));
        const f = await fr.run({ global_hidden: hid, repetition_seen_mask: new ort.Tensor('int32', mask, [1, 16, 1024]), assistant_random_u: new ort.Tensor('float32', new Float32Array([cl(u())]), [1]), audio_random_u: new ort.Tensor('float32', Float32Array.from({ length: 16 }, () => cl(u())), [1, 16]) });
        if (Number(f.should_continue.data[0]) === 0) break;
        const frame = Array.from(f.frame_token_ids.data, Number); frame.forEach((x, q) => { seen[q][x] = 1; }); tramas.push(frame);
        const fila = new Int32Array(W).fill(c.audio_pad_token_id); fila[0] = c.audio_assistant_slot_token_id; frame.forEach((x, q) => { fila[1 + q] = x; });
        const feeds = { input_ids: new ort.Tensor('int32', fila, [1, 1, W]), past_valid_lengths: new ort.Tensor('int32', new Int32Array([valid]), [1]) };
        for (const n of names.decode_input_names.slice(2)) feeds[n] = past[n];
        const d = await dec.run(feeds); hid = last(d.global_hidden);
        past = Object.fromEntries(names.decode_output_names.slice(1).map((n) => [n.replace('present_', 'past_'), d[n]])); valid++;
      }
      ts.push(performance.now() - t0);
    }
    res['ONNX ' + h] = { ms: Math.min(...ts), tramas };
  }
  const base = res['ONNX 1'];
  for (const [k, x] of Object.entries(res)) {
    const iguales = base ? x.tramas.filter((f, i) => JSON.stringify(f) === JSON.stringify(base.tramas[i])).length : '?';
    out(`  ${k.padEnd(11)} ${x.ms.toFixed(0)} ms · ${base ? '×' + (base.ms / x.ms).toFixed(2) + ' sobre ONNX 1 hilo' : ''} · tramas iguales a ONNX ${iguales}/${x.tramas.length}`);
  }
}

async function todo() {
  $('go').disabled = true;
  const t0 = performance.now();
  try {
    const a = await navigator.gpu?.requestAdapter();
    out('gráfica: ' + JSON.stringify({ vendor: a?.info?.vendor, architecture: a?.info?.architecture, sg: [a?.info?.subgroupMinSize, a?.info?.subgroupMaxSize] }) + ` · aislada ${self.crossOriginIsolated} · núcleos ${navigator.hardwareConcurrency}`);
    if ($('c-duelo').checked && a) { out('\n== Duelo contra la librería de LiquidAI (LFM3-Omni-2B, en la gráfica)'); try { await duelo(); } catch (e) { out('ERROR duelo: ' + (e.stack || e.message).slice(0, 400)); } }
    if ($('c-perfil').checked && a) { out('\n== Perfil de un token en la gráfica (LFM3 Q4)'); try { await perfil(); } catch (e) { out('ERROR perfil: ' + (e.stack || e.message).slice(0, 400)); } }
    if ($('c-cpu').checked) { out('\n== LFM3 Q4 en la CPU'); try { await cpu(); } catch (e) { out('ERROR CPU: ' + (e.stack || e.message).slice(0, 400)); } }
    if ($('c-voz').checked) { out('\n== Voz MOSS en la CPU: Elffuss contra onnxruntime-web (24 tramas)'); try { await voz(); } catch (e) { out('ERROR voz: ' + (e.stack || e.message).slice(0, 400)); } }
  } finally {
    out(`\nterminado en ${((performance.now() - t0) / 60000).toFixed(1)} min`);
    fase('Listo. Copia los resultados y pégamelos.');
    $('copiar').hidden = false; $('go').disabled = false;
  }
}

$('go').onclick = async () => { $('out').textContent = ''; if (await aislar()) await todo(); };
$('copiar').onclick = async () => { await navigator.clipboard.writeText($('out').textContent); $('copiar').textContent = 'Copiado'; };
if (sessionStorage.getItem('banco-v2-seguir') && self.crossOriginIsolated) { sessionStorage.removeItem('banco-v2-seguir'); todo(); }
</script>
</body>
</html>
